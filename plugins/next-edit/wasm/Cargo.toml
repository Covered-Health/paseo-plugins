[package]
name = "paseo-zeta-wasm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.130"
serde_json = "1"
zeta_prompt = { path = ".upstream/zeta_prompt" }

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
